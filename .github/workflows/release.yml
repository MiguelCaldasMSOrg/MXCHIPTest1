name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version in vX.Y.Z format
        required: true
        type: string
      dry_run:
        description: Build without creating a tag or release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi

          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$version" =~ ^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$ ]]; then
            echo "::error::Version '$version' must use vX.Y.Z semantic-version format."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Arduino CLI
        env:
          ARDUINO_CLI_VERSION: 1.5.1
          ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
        run: |
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"

          curl --fail --location --silent --show-error \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${ARDUINO_CLI_SHA256}  /tmp/${archive}" | sha256sum --check

          tar -xzf "/tmp/${archive}" -C /tmp arduino-cli
          install -d "$HOME/.local/bin"
          install /tmp/arduino-cli "$HOME/.local/bin/arduino-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install MXCHIP board core
        run: |
          package_root="$HOME/.arduino15/packages/AZ3166"
          core_dir="$package_root/hardware/stm32f4/2.0.0"
          gcc_dir="$package_root/tools/arm-none-eabi-gcc/5_4-2016q3"
          openocd_dir="$package_root/tools/openocd/0.10.0"

          install -d "$core_dir" "$gcc_dir" "$openocd_dir"

          curl --fail --location --silent --show-error \
            https://github.com/microsoft/devkit-sdk/releases/download/2.0.0/AZ3166-2.0.0.zip \
            --output /tmp/AZ3166-2.0.0.zip
          echo "6af3a1a95741a53da4b9284b8b88d46aa18976c4c0e8ff2bc418e56196863894  /tmp/AZ3166-2.0.0.zip" \
            | sha256sum --check
          unzip -q /tmp/AZ3166-2.0.0.zip -d /tmp/mxchip-core
          cp -a /tmp/mxchip-core/AZ3166/. "$core_dir"

          curl --fail --location --silent --show-error \
            https://github.com/VSChina/azureiotdevkit_tools/releases/download/1.0/gcc-arm-none-eabi-6-2017-q1-linux64.tar.gz \
            --output /tmp/mxchip-gcc.tar.gz
          echo "48e71153fae405fe771b3b339111404cd4e363eff4316b15cfe9835758da0221  /tmp/mxchip-gcc.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/mxchip-gcc.tar.gz --strip-components=1 -C "$gcc_dir"

          curl --fail --location --silent --show-error \
            https://github.com/VSChina/azureiotdevkit_tools/releases/download/1.0/openocd-linux64-0.10.0.tar \
            --output /tmp/mxchip-openocd.tar
          echo "c85f0ea48136ed09b03ecc5a6861dc4be77e012defe5f8e574f22f9f86ab52c1  /tmp/mxchip-openocd.tar" \
            | sha256sum --check
          tar -xf /tmp/mxchip-openocd.tar --strip-components=1 -C "$openocd_dir"

      - name: Test protocol and gated application behavior
        shell: pwsh
        run: |
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-rf.ps1")

      - name: Test onboard diagnostic modes
        shell: pwsh
        run: |
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-diagnostics.ps1")
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-stsafe.ps1")
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-supplied-keys.ps1")
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-nfc.ps1")

      - name: Test application firmware validation
        shell: pwsh
        run: |
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-validate-firmware.ps1")
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "test-board-maintenance.ps1")

      - name: Validate all supported configurations
        shell: pwsh
        run: |
          $builder = Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "build.ps1"
          foreach ($mode in 0..16) {
            & $builder -Mode $mode -BuildDirectory (Join-Path "_build" "mode-$mode")
          }

      - name: Compile default release firmware
        shell: pwsh
        run: |
          & (Join-Path (Join-Path $env:GITHUB_WORKSPACE "tools") "build.ps1")

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          options=(--title "$VERSION" --generate-notes --verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          notes=$(cat <<'NOTES'
          **Application-only firmware.** Upload `MXCHIPTest1.ino.bin` with Arduino CLI/OpenOCD at **`0x0800C000`**. Do **not** copy this binary onto the AZ3166 virtual disk.

          Assets: application binary, ELF, map and the STSELib BSD-3-Clause license.

          Firmware uses the default mode selected in `src/AppConfig.h`; compile another mode explicitly when needed. Mode 15 installs operator-supplied STSAFE host keys after explicit confirmation. Key personalization requires hardware qualification; read the supplied-key guide before use.
          NOTES
          )

          assets=(
            build/MXCHIPTest1.ino.bin
            build/MXCHIPTest1.ino.elf
            build/MXCHIPTest1.ino.map
            libraries/STSELib/LICENSE.txt
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            fi
          done
          gh release create "$VERSION" "${assets[@]}" "${options[@]}" --notes "$notes"
